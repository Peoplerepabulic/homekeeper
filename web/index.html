<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HomeKeeper — Simulated Alexa+ Experience</title>
<style>
  :root{
    --bg0:#070b16; --bg1:#0d1426; --panel:#141d33; --card:#1a2440;
    --line:#2a3a5f; --ink:#eef2ff; --muted:#9aa7c7; --dim:#6b7694;
    --alexa:#00c8ff; --alexa2:#0077ff; --accent:#4da3ff;
    --ok:#3ddc84; --warn:#ffb020; --bad:#ff5d5d; --info:#7aa2ff;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%, #16224a 0%, var(--bg1) 45%, var(--bg0) 100%);
    color:var(--ink); min-height:100vh; display:flex; justify-content:center;
  }
  #show{width:100%; max-width:760px; min-height:100vh; display:flex; flex-direction:column;
        padding:0 16px calc(16px + env(safe-area-inset-bottom));}
  /* Alexa light bar */
  #lightbar{height:5px; border-radius:0 0 6px 6px; margin:0 -16px 10px;
    background:linear-gradient(90deg,var(--alexa2),var(--alexa),var(--alexa2));
    opacity:.35; transition:opacity .3s;}
  #lightbar.listening{opacity:1; animation:pulse 1.2s ease-in-out infinite;}
  #lightbar.speaking{opacity:1; animation:wave 1s ease-in-out infinite;}
  #lightbar.thinking{opacity:1; animation:pulse .6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{filter:brightness(.8)}50%{filter:brightness(1.6)}}
  @keyframes wave{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.2)}}
  /* honest label */
  #simlabel{display:flex; align-items:center; gap:8px; justify-content:center;
    font-size:12px; color:#ffd479; background:rgba(255,180,40,.08);
    border:1px solid rgba(255,180,40,.25); border-radius:999px;
    padding:6px 14px; margin:0 auto 12px; max-width:100%;}
  #simlabel .dot{width:8px;height:8px;border-radius:50%;background:#ffd479;flex:none}
  /* thread */
  #thread{flex:1; display:flex; flex-direction:column; gap:12px; padding:6px 2px 12px;
          overflow-y:auto;}
  .msg{max-width:88%; padding:11px 15px; border-radius:var(--radius); line-height:1.55;
       font-size:15px; word-break:break-word;}
  .msg.user{align-self:flex-end; background:linear-gradient(135deg,#1f6feb,#4da3ff);
            color:#fff; border-bottom-right-radius:6px;}
  .msg.alexa{align-self:flex-start; background:var(--panel); border:1px solid var(--line);
             border-bottom-left-radius:6px;}
  .msg.alexa .who{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--alexa);
                  margin-bottom:5px; font-weight:600;}
  .msg.alexa .who .ring{width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--alexa), var(--alexa2));
    box-shadow:0 0 8px var(--alexa);}
  .msg.thinking{align-self:flex-start; background:var(--panel); border:1px solid var(--line);
    color:var(--muted); font-size:14px;}
  .msg.thinking .dots::after{content:""; animation:dots 1.2s steps(4) infinite;}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  .msg.error{align-self:flex-start; background:#3a1620; border:1px solid #7a2a35; color:#ffb3b3;}
  /* cards */
  .card{align-self:stretch; background:var(--card); border:1px solid var(--line);
        border-radius:var(--radius); padding:16px; margin-top:-4px;}
  .card h3{margin:0 0 4px; font-size:16px; display:flex; align-items:center; gap:8px;}
  .card .via{font-size:11.5px; color:var(--dim); margin-bottom:10px;}
  .card .via b{color:var(--ok); font-weight:600;}
  .brow{display:flex; gap:10px; align-items:flex-start; padding:10px 8px;
        border-radius:12px; cursor:default;}
  .brow.tap{cursor:pointer;}
  .brow.tap:hover{background:rgba(255,255,255,.04);}
  .brow + .brow{border-top:1px solid rgba(255,255,255,.06);}
  .brow .ic{font-size:20px; flex:none; width:28px; text-align:center;}
  .brow .tx{flex:1; min-width:0;}
  .brow .t1{font-size:14.5px; font-weight:600;}
  .brow .t2{font-size:13px; color:var(--muted); margin-top:2px;}
  .pill{flex:none; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
        white-space:nowrap; margin-top:2px;}
  .pill.overdue,.pill.high{background:rgba(255,93,93,.15); color:#ff8f8f; border:1px solid rgba(255,93,93,.4);}
  .pill.due_soon{background:rgba(255,176,32,.13); color:#ffcf7a; border:1px solid rgba(255,176,32,.4);}
  .pill.ok{background:rgba(61,220,132,.12); color:#7fe6a8; border:1px solid rgba(61,220,132,.35);}
  .pill.info{background:rgba(122,162,255,.13); color:#a9c2ff; border:1px solid rgba(122,162,255,.4);}
  .krow{display:flex; justify-content:space-between; gap:12px; padding:7px 2px; font-size:14px;
        border-top:1px solid rgba(255,255,255,.05);}
  .krow .k{color:var(--muted);} .krow .v{text-align:right; font-weight:600;}
  .krow .v.good{color:var(--ok);} .krow .v.bad{color:var(--bad);} .krow .v.warn{color:var(--warn);}
  .note{font-size:13px; color:var(--muted); background:rgba(255,255,255,.04);
        border-radius:10px; padding:10px 12px; margin-top:10px; line-height:1.5;}
  .rec{font-size:14px; border-radius:10px; padding:10px 12px; margin-top:10px; line-height:1.5;
       background:rgba(0,200,255,.07); border:1px solid rgba(0,200,255,.25);}
  .btnrow{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;}
  .btn{flex:1; min-width:140px; padding:12px 14px; border-radius:12px; border:1px solid var(--alexa);
       background:rgba(0,200,255,.1); color:var(--ink); font-size:14.5px; font-weight:600;
       cursor:pointer;}
  .btn:hover{background:rgba(0,200,255,.2);}
  .btn.ghost{border-color:var(--line); background:rgba(255,255,255,.04);}
  .btn:disabled{opacity:.45; cursor:default;}
  /* QR */
  .qrwrap{display:flex; flex-direction:column; align-items:center; gap:10px; padding:8px 0;}
  .qrwrap .qr{background:#fff; padding:14px; border-radius:12px; line-height:0;}
  .qrwrap .qr svg{display:block; width:200px; height:200px;}
  .qrwrap .url{font-size:11.5px; color:var(--dim); word-break:break-all; text-align:center;
               max-width:100%;}
  #upstatus{font-size:13.5px; color:var(--warn); text-align:center; min-height:20px;}
  #upstatus.done{color:var(--ok);}
  /* demo bar + input */
  #demobar{display:flex; gap:8px; padding:10px 0;}
  #demobar .btn{min-width:0; padding:11px 6px; font-size:13.5px;}
  #inputbar{display:flex; gap:8px; align-items:center; background:var(--panel);
            border:1px solid var(--line); border-radius:999px; padding:6px 6px 6px 8px;}
  #micBtn,#sendBtn,#voiceBtn{flex:none; width:42px; height:42px; border-radius:50%; border:0;
    font-size:19px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  #micBtn{background:rgba(0,200,255,.14); color:var(--alexa);}
  #micBtn.live{background:var(--bad); color:#fff; animation:pulse 1s infinite;}
  #micBtn:disabled{opacity:.35;}
  #sendBtn{background:linear-gradient(135deg,#1f6feb,#4da3ff); color:#fff;}
  #voiceBtn{background:transparent; color:var(--muted); font-size:17px;}
  #voiceBtn.off{opacity:.35;}
  #textInput{flex:1; min-width:0; background:transparent; border:0; outline:0; color:var(--ink);
             font-size:15px; padding:8px 4px;}
  #textInput::placeholder{color:var(--dim);}
  #foot{text-align:center; font-size:11px; color:var(--dim); padding:10px 0 2px;}
  #foot a{color:var(--dim);}
  @media (min-width:700px){ .msg{font-size:15.5px;} }
</style>
</head>
<body>
<div id="show">
  <div id="lightbar"></div>
  <div id="simlabel"><span class="dot"></span><span>Simulated Alexa+ experience &middot; Real MCP backend on AWS &middot; Demo household</span></div>
  <div id="thread" aria-live="polite"></div>
  <div id="demobar">
    <button class="btn" data-demo="briefing">☀️ Morning Briefing</button>
    <button class="btn" data-demo="triage">🔧 Issue Triage</button>
    <button class="btn" data-demo="photo">📷 Photo Onboarding</button>
  </div>
  <div id="inputbar">
    <button id="micBtn" title="Voice input" disabled>🎤</button>
    <input id="textInput" placeholder="Ask HomeKeeper… (or tap the mic)" autocomplete="off">
    <button id="voiceBtn" title="Alexa voice output toggle">🔊</button>
    <button id="sendBtn" title="Send">➤</button>
  </div>
  <div id="foot">HomeKeeper &middot; Build, Ship, Shape: Amazon Developer Hackathon &middot;
    <a href="upload.html">photo upload page</a> &middot;
    <a href="privacy.html">privacy</a> &middot; <a href="terms.html">terms</a></div>
</div>

<script>
"use strict";
/* ================= config ================= */
var MCP_URL  = "https://7xxrr1lk9e.execute-api.us-east-1.amazonaws.com/mcp";
var CHAT_URL = "https://7xxrr1lk9e.execute-api.us-east-1.amazonaws.com/chat"; // homekeeper-chat via API Gateway

/* ================= tiny MCP client (browser-native, Streamable HTTP) ================= */
var _mid = 1, _inited = false;
function sseFirstJson(text){
  var payload = text.trim();
  var lines = text.split("\n");
  for (var i=0;i<lines.length;i++){
    var l = lines[i].trim();
    if (l.indexOf("data:")===0){ payload = l.slice(5).trim(); break; }
  }
  return JSON.parse(payload);
}
function mcpRpc(method, params){
  var body = JSON.stringify({jsonrpc:"2.0", id:(_mid++), method:method, params:params||{}});
  var t0 = performance.now();
  return fetch(MCP_URL, {method:"POST",
    headers:{"Content-Type":"application/json","Accept":"application/json, text/event-stream"},
    body:body}).then(function(res){
      var ms = Math.round(performance.now()-t0);
      if(!res.ok) throw new Error("MCP HTTP "+res.status);
      return res.text().then(function(text){
        var msg = sseFirstJson(text);
        if(msg.error) throw new Error(msg.error.message||"MCP error");
        return {result:msg.result, ms:ms};
      });
    });
}
function mcpInit(){
  if(_inited) return Promise.resolve();
  return mcpRpc("initialize",{protocolVersion:"2025-11-25",capabilities:{},
    clientInfo:{name:"homekeeper-show",version:"1.0"}}).then(function(){ _inited=true; });
}
function callTool(name, args){
  return mcpInit().then(function(){
    return mcpRpc("tools/call",{name:name, arguments:args||{}});
  }).then(function(r){
    var blocks = (r.result && r.result.content)||[];
    var t = null;
    for(var i=0;i<blocks.length;i++) if(blocks[i].type==="text"){ t=blocks[i].text; break; }
    var data = t ? JSON.parse(t) : {};
    return {data:data, ms:r.ms};
  });
}
</script>
<script>
"use strict";
/* ================= UI helpers ================= */
var threadEl = document.getElementById("thread");
var lightbar = document.getElementById("lightbar");
function scrollDown(){ threadEl.scrollTop = threadEl.scrollHeight; }
function setBar(state){ lightbar.className = state||""; } // "", listening, thinking, speaking
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,
  function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function addUser(text){
  var d=document.createElement("div"); d.className="msg user"; d.textContent=text;
  threadEl.appendChild(d); scrollDown();
}
function addAlexa(text, speakIt){
  var d=document.createElement("div"); d.className="msg alexa";
  var who=document.createElement("div"); who.className="who";
  who.innerHTML='<span class="ring"></span><span>Alexa · HomeKeeper</span>';
  var body=document.createElement("div"); body.textContent=text;
  d.appendChild(who); d.appendChild(body); threadEl.appendChild(d); scrollDown();
  if(speakIt) speak(text);
  return d;
}
function addError(text){
  var d=document.createElement("div"); d.className="msg error"; d.textContent="⚠️ "+text;
  threadEl.appendChild(d); scrollDown();
}
function thinking(){
  var d=document.createElement("div"); d.className="msg thinking"; d.id="thinking";
  d.innerHTML='Alexa is thinking<span class="dots"></span>';
  threadEl.appendChild(d); scrollDown(); setBar("thinking");
}
function unthinking(){
  var d=document.getElementById("thinking"); if(d) d.remove(); setBar("");
}
function addCard(html){
  var d=document.createElement("div"); d.className="card"; d.innerHTML=html;
  threadEl.appendChild(d); scrollDown(); return d;
}
function via(ms, tool, source){
  source = source || "MCP";
  var t = (ms && ms>0) ? ' · '+ms+'ms '+(ms<500?'<b>✓</b> &lt;500ms':'') : '';
  return '<div class="via">via '+esc(source)+' · <b>'+esc(tool)+'</b>'+t+'</div>';
}
/* urgency / date helpers */
var URG = {overdue:"Overdue", due_soon:"Due soon", high:"Urgent", ok:"OK"};
var TYPE_ICON = {maintenance:"🔧", warranty:"🛡️", recall:"⚠️"};
function relDate(iso){
  if(!iso) return "—";
  var demo = new Date("2026-10-04T12:00:00");
  var d = new Date(iso+"T12:00:00");
  var days = Math.round((d-demo)/86400000);
  if(days===0) return "Today";
  if(days>0) return "in "+days+"d ("+iso+")";
  return Math.abs(days)+"d ago ("+iso+")";
}

/* ================= cards ================= */
function briefingCard(data, ms, source){
  var items = data.items||[];
  var h = '<h3>🏠 Home Briefing</h3>'+via(ms,"get_home_briefing",source);
  h += '<div class="note">'+esc(data.summary||"")+'</div>';

  return h;
}
function detailCard(data, ms, source){
  var a = data.appliance||{}, w = data.warranty||{};
  var wcls = w.status==="active"?"good":(w.status==="expired"?"bad":"warn");
  var wtxt = w.status==="active" ? ("Under warranty until "+w.warranty_end)
           : (w.status==="expired" ? "Expired" : "Warranty unknown");

    h += '<div class="krow"><span class="k">'+esc(t.task||"")+'</span><span class="v">'

    h += '<div class="note">⚠️ '+esc(al.title||"")+'</div>';

}
function triageCard(data, ms, source){
  var w = data.warranty||{};

  h += '<div class="krow"><span class="k">In use</span><span class="v">'+esc(data.device_age||"—")+'</span></div>';
  h += '<div class="krow"><span class="k">Warranty</span><span class="v '+wcls+'">'+esc(wtxt)+'</span></div>';

  if(data.triage && data.triage.note)
    h += '<div class="note">📖 Knowledge base: '+esc(data.triage.note)+'</div>';
  var rec, rcls="";

  if(hasRecall) rec = "⚠️ This appliance has an unread recall alert — check the official recall notice first.";
  else if(w.status==="active") rec = "✅ Still under warranty — contact the manufacturer's support for a warranty claim.";

  h += '<div class="rec">'+esc(rec)+'<br><span style="font-size:12px;color:var(--muted)">Rule-based suggestion, for reference only</span></div>';

}
function reorderCard(data, ms, source){

  h += '<div class="note">'+esc(data.summary||"")+'</div>';

    h += '<div class="brow"><span class="ic">📦</span><span class="tx">'

}

}
function fieldsCard(f, s3key){

<script>
"use strict";
/* ================= voice ================= */
var voiceOn = true;
var voiceBtn = document.getElementById("voiceBtn");
voiceBtn.addEventListener("click", function(){
  voiceOn = !voiceOn;
  voiceBtn.classList.toggle("off", !voiceOn);
  voiceBtn.textContent = voiceOn ? "🔊" : "🔇";
  if(!voiceOn && "speechSynthesis" in window) window.speechSynthesis.cancel();
});
function speak(text){
  if(!voiceOn || !("speechSynthesis" in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 1.05;
    u.onstart = function(){ setBar("speaking"); };
    u.onend = u.onerror = function(){ setBar(""); };
    window.speechSynthesis.speak(u);
  }catch(e){/* no-op */}
}
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var micBtn = document.getElementById("micBtn"), recog = null;
if(SR){
  micBtn.disabled = false;
  micBtn.addEventListener("click", function(){
    if(recog){ recog.stop(); return; }
    recog = new SR(); recog.lang = "en-US"; recog.interimResults = false;
    recog.onstart = function(){ micBtn.classList.add("live"); setBar("listening"); };
    recog.onend = function(){ micBtn.classList.remove("live"); setBar(""); recog=null; };
    recog.onerror = function(){ micBtn.classList.remove("live"); setBar(""); recog=null; };
    recog.onresult = function(ev){
      var t = ev.results[0][0].transcript;
      document.getElementById("textInput").value = t;
      freeAsk(t);
    };
    try{ recog.start(); }catch(e){ recog=null; }
  });
} else {
  micBtn.title = "Voice recognition not supported in this browser — please type";
}

/* ---- photo onboarding ---- */
var POLL_MS = 3000, POLL_ROUNDS = 300; // 15 min
function sleep(ms){ return new Promise(function(r){setTimeout(r,ms);}); }
function chatPost(body){
  return fetch(CHAT_URL, {method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)})
    .then(function(res){
      if(!res.ok) throw new Error("chat HTTP "+res.status);
      return res.json();
    });
}
function demoPhoto(){
  addUser("Alexa, I want to add a new appliance by photo.");
  thinking();
  callTool("start_photo_onboarding", {}).then(function(r){
    unthinking();
    var data = r.data;
    addAlexa(data.summary||"Please scan the code to take a photo.", true);
    var token = null;
    try{ token = new URL(data.upload_url).searchParams.get("token"); }catch(e){}
    var qc = qrCard(data, token, r.ms);
    var card = addCard(qc.html);
    // render QR
    try{
      var qr = qrcode(0, "M"); qr.addData(data.upload_url); qr.make();
      document.getElementById("qrbox").innerHTML = qr.createSvgTag({scalable:true});
    }catch(e){
      document.getElementById("qrbox").innerHTML =
        '<div style="color:#333;font-size:12px;padding:20px">QR generation failed — please copy the link above</div>';
    }
    startCountdown(15*60);
    var s3key = token ? ("uploads/"+token+".jpg") : null;
    var done = false;
    function setStatus(html, cls){
      var el = document.getElementById("upstatus");
      if(el){ el.innerHTML = html; el.className = cls||""; }
    }
    function onUploaded(){
      if(done) return; done = true;
      setStatus("✅ Photo received — scanning nameplate…", "done");
      extractAndConfirm(card, s3key, token);
    }
    document.getElementById("alreadyUp").addEventListener("click", onUploaded);
    // auto-poll via chat Lambda (if deployed)
    if(CHAT_URL && s3key){
      (function poll(n){
        if(done || n<=0) return;
        chatPost({action:"check_upload", s3_key:s3key}).then(function(d){
          if(d.uploaded) onUploaded();
          else sleep(POLL_MS).then(function(){ poll(n-1); });
        }).catch(function(){ sleep(POLL_MS).then(function(){ poll(n-1); }); });
      })(POLL_ROUNDS);
    }
  }).catch(mcpFail);
}
function startCountdown(sec){
  var el = document.getElementById("upcount");
  if(!el) return;
  var t = setInterval(function(){
    sec--;
    if(sec<=0){ clearInterval(t); if(el) el.textContent="Expired"; return; }
    if(el) el.textContent = String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
  }, 1000);
}
function extractAndConfirm(cardEl, s3key, token){
  if(!CHAT_URL){ addError("Recognition service is not deployed yet."); return; }
  chatPost({action:"extract_nameplate", s3_key:s3key}).then(function(f){
    if(f.error){ addError("Nameplate recognition failed: "+f.error); return; }
    addAlexa("Nameplate scan complete — please verify the details.", true);
    var fc = fieldsCard(f, s3key);
    var card = addCard(fc.html);
    document.getElementById("cancelAdd").addEventListener("click", function(){
      addAlexa("OK, add cancelled.", true);
    });
    document.getElementById("confirmAdd").addEventListener("click", function(){
      var v = function(o){ return (o&&o.value)||null; };
      var catEl = document.getElementById("catPick");
      var category = (catEl && catEl.value) || f.suggested_category || "refrigerator";
      thinking();
      callTool("add_appliance", {
        category: category,
        brand: v(f.brand), model: v(f.model)
      }).then(function(r){
        unthinking();
        addAlexa(r.data.summary||"Added.", true);
        var c2 = addCard(addedCard(r.data, r.ms));
        c2.querySelector("#refreshBrief").addEventListener("click", demoBriefing);
      }).catch(mcpFail);
    });
  }).catch(function(e){ addError("Nameplate recognition failed: "+(e.message||e)); });
}

/* ================= free ask ================= */
var chatHistory = [];
function freeAsk(text){
  text = (text||"").trim();
  if(!text) return;
  document.getElementById("textInput").value = "";
  addUser(text);
  if(!CHAT_URL){
    addAlexa("Free-ask mode is still coming online (Bedrock chat deploys separately). Try the three demo buttons above ☝️", true);
    return;
  }
  thinking();
  chatHistory.push({role:"user", text:text});
  chatPost({action:"chat", message:text, history:chatHistory.slice(-10)}).then(function(d){
    unthinking();
    if(d.error){ addError(d.error); return; }
    chatHistory.push({role:"assistant", text:d.reply||""});
    addAlexa(d.reply||"(no reply)", true);
    (d.tool_calls||[]).forEach(function(tc){
      if(!tc.result) return;
      try{
        if(tc.name==="get_home_briefing") addCard(briefingCard(tc.result, 0, "Bedrock chat"));
        else if(tc.name==="get_reorder_options"&&(tc.result.options||[]).length) addCard(reorderCard(tc.result, 0, "Bedrock chat"));
        else if(tc.name==="report_issue") addCard(triageCard(tc.result, 0, "Bedrock chat"));
        else if(tc.name==="get_appliance"&&tc.result.appliance) addCard(detailCard(tc.result, 0, "Bedrock chat"));
      }catch(e){/* card render is best-effort */}
    });
  }).catch(function(e){ unthinking(); addError("Chat service error: "+(e.message||e)); });
}
